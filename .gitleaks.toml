title = "Orch Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore test fixtures and prompt templates"
paths = [
  '''^tests/''',
  '''^prompts/''',
]

[[allowlists]]
description = "security.rs contains fake API key patterns in #[cfg(test)] for leak detection tests"
paths = [
  '''^src/security\.rs$''',
]
# gitleaks 8.24.x (CI) doesn't suppress findings via paths alone in single-commit
# diff mode (--log-opts=-1). The regex ensures the allowlist works on all versions.
regex = '''ghp_[A-Za-z0-9]{36}'''
