jobs:
- id: code-review-orch
  type: task
  schedule: '0 */4 * * *'
  task:
    title: 'Code quality review'
    body: |
      You are a code quality reviewer. Focus on bugs, correctness, and reliability in EXISTING code. Do NOT look at feature gaps or new functionality — that's the development job's responsibility.

      ## Before starting

      - `git log --since="48 hours ago" --oneline` — don't file tasks for recent fixes
      - `gh issue list --state open` — don't duplicate existing issues
      - `gh issue list --state closed --limit 20` — don't re-file resolved problems
      - Read the `DO NOT TOUCH` sections in `AGENTS.md` — respect settled decisions

      ## What to review

      Review `src/**/*.rs`, `prompts/*.md`, and tests. Look for:
      - **Bugs** - logic errors, edge cases, panics, `unwrap`/`expect` on fallible paths, incorrect assumptions
      - **Error handling** - missing propagation, swallowed errors, vague messages, missing context, fallible operations without retries/timeouts where needed
      - **Dead code** - unused functions, stale branches, unreachable code, unused imports, outdated prompts/tests
      - **Correctness** - race conditions, ordering bugs, off-by-one errors, invalid state transitions, missing boundary validation
      - **Async safety** - blocking work in async contexts, holding locks across `.await`, missing cancellation handling, overly broad lock scope
      - **API/contracts** - mismatches between code, prompts, CLI behavior, and tests; broken invariants; missing validation of external inputs
      - **Observability** - missing logs or trace context on failure paths that make debugging reliability issues hard
      - **Security** - unsafe shell usage, secret leakage in logs/errors, unchecked external input, path handling bugs
      - **Technical debt** - fragile abstractions, duplicated logic in similar paths, inconsistencies that increase bug risk
      - **Test gaps** - untested error paths, regressions, concurrency behavior, prompt behavior, and boundary conditions
      - **Inefficiencies** - Audit and refactor codebase for unnecessary SQL queries, serial API calls, and O(n) inefficiencies.
      - **Code quality** - prefer `use` imports for functions, types, and traits instead of fully qualified module paths, even for a single call, unless module context or a name collision makes that worse; keep idiomatic Rust, consistent formatting, and clear variable names
      - **Unnecessary complexity** - over-engineered abstractions, redundant indirection layers, features that duplicate existing functionality, overly clever code that could be simpler, multiple code paths that could be unified. The system is already complex — every review should ask "can this be simpler?"

      Do NOT look for: feature ideas, pure cleanup, speculative performance work, or large architecture redesigns. Those belong to the development job unless they directly cause a correctness, reliability, or maintainability problem.

      ## Create GitHub issues for findings

      Use `gh issue create --title "..." --body "..." --label "bug"` to create issues. Orch will sync and dispatch them.

      - Maximum 3-5 issues. Fewer is better.
      - Each issue MUST include: file path, line numbers, what's wrong, and what the fix should be.
      - Focus on ROOT CAUSES, not symptoms
      - Trace symptoms to root causes. ONE issue per root cause.
      - Do NOT create issues about `src/github/token.rs` or the agent runner — settled.
      - Do NOT create cosmetic issues (formatting, naming, comments).
    agent: null
  command: null
  enabled: true
  external: false
- id: code-development-orch
  type: task
  schedule: '30 */5 * * *'
  task:
    title: 'Code development: find improvements and create tasks'
    body: |
      You are a planning agent for orch. Your job is to find high-value improvements and create tasks for them. Do NOT implement anything — the task pipeline handles execution.

      ## Where to look (in priority order)

      1. **Design specs** - check `docs/research/*.md`, `docs/specs/*.md` and `docs/plans/*.md` for concrete, unimplemented items. FIRST verify whether each item already exists in code, prompts, schema, or tests before filing anything and respect docs/architecture.md decisions. Break real gaps into small, actionable tasks.
      2. **Agent failures** - check `orch task list --status blocked` and `orch task list --status needs_review`. Read recent task attempts in `~/.orch/state/*/tasks/*/attempts/` and determine the root cause: prompt weakness, missing tool, timeout, flaky workflow, model limitation, or missing product logic.
      3. **Logs and operations** - run `orch log 200` and look for recurring failures, noisy warnings, retries, rate limits, slow paths, webhook/polling confusion, and dispatch loops. Create tasks that remove the underlying cause, not just the visible symptom.
      4. **Prompt effectiveness** - review `prompts/*.md` and compare them with recent task behavior. Look for unclear instructions, conflicting constraints, brittle output requirements, missing examples, or prompts that encourage duplicated/repeated work.
      5. **Workflow and UX gaps** - inspect CLI flows, issue/PR automation, task routing, review loops, and status transitions. Look for missing affordances, confusing behavior, or repeated manual steps that should be automated.
      6. **Simplification and complexity reduction** - the system is already complex. Prioritize tasks that REMOVE code, merge duplicate paths, eliminate unnecessary abstractions, or simplify state machines. Three similar lines of code is better than a premature abstraction. Flag over-engineered areas where simpler approaches would work.
      7. **Performance** - look for measurable slow paths: repeated expensive work, unnecessary allocations/cloning, blocking work in async contexts, inefficient queries, or polling intervals that create needless churn.
      8. **Inefficiencies** - Audit and refactor codebase for unnecessary SQL queries, serial API calls, and O(n) inefficiencies.
      9. **Architecture/documentation gaps** - read `docs/architecture.md`, `AGENTS.md`, and related docs for documented TODOs, drift between docs and implementation, or missing glue between components.
      10. **Test coverage** - find missing tests for new features, key workflows, regressions, and important failure paths where better coverage would unlock safer development.

      ## Before creating tasks

      - `git log --since="48 hours ago" --oneline` — don't file tasks for recent work
      - `gh issue list --state open` — don't duplicate existing issues
      - `gh issue list --state closed --limit 20` — don't re-file resolved problems
      - Read the `DO NOT TOUCH` sections in `AGENTS.md` — respect settled decisions
      - **Check existing code/schema before creating migration or feature tasks** - run `sqlite3 ~/.orch/orch.db ".tables"` and search with `rg` for existing implementations. Do NOT create tasks for things that already exist or are partially implemented unless the remaining gap is clear.
      - **NEVER append to existing migration files** - always create a NEW numbered migration file. Appending to already-applied migrations breaks existing databases.
      - Prefer a small number of high-signal tasks over a long list of weak ideas. If you cannot name the root cause and the concrete files likely involved, do not file it.
      - **Favor simplification over new features.** Tasks that remove code or reduce complexity are more valuable than tasks that add new capabilities. The system is already complex enough.

      ## Create GitHub issues

      Use `gh issue create --title "..." --body "..." --label "enhancement"` to create issues. Orch will sync and dispatch them.

      - Maximum 2-3 issues per run. Fewer is better.
      - Each issue MUST be actionable: include file paths, line numbers when available, user/operator impact, and a clear description of what should change.
      - Focus on ROOT CAUSES, not symptoms
      - Trace symptoms to root causes. ONE issue per root cause, not one per symptom.
      - Prefer tasks that improve reliability, reduce operator toil, unblock agents, clarify prompts, or deliver concrete product value.
      - Do NOT create issues about `src/github/token.rs` or the agent runner - those are settled unless a human explicitly asks.
      - Do NOT create cosmetic-only or vague cleanup issues.
      - Include enough context, evidence, and likely touch points that the implementing agent does not need to rediscover the problem from scratch.
    agent: null
  command: null
  enabled: true
  external: false
- id: morning-review
  type: task
  schedule: '0 10 * * *'
  task:
    title: 'Daily morning review'
    body: |
      Morning check-in. Your ONLY output is a summary post — do NOT modify code.

      ## Gather context

      1. `git log --since="24 hours ago" --oneline` — what changed recently
      2. Read the most recent post in `./docs/content/posts/` — current state and context
      3. Read the most recent evening retrospective — carry forward unfinished priorities
      4. `gh issue list --state open` — what's in the pipeline
      5. `orch task list` — check for stuck, blocked, or failing tasks

      ## Check operational health

      1. Are any tasks stuck or failing repeatedly? Note the pattern and root cause.
      2. Are there error patterns in logs (`orch log 200`)? Note them.
      3. Did the evening retro flag anything? Is it resolved or still pending?
      4. Are there tasks waiting on owner feedback?
      5. Check task_runs for agent/model failure patterns: `sqlite3 ~/.orch/orch.db "SELECT agent, model, outcome, COUNT(*) FROM task_runs WHERE started_at > datetime('now', '-24 hours') GROUP BY agent, model, outcome ORDER BY COUNT(*) DESC;"`
      6. If `task_activity` table exists, check recent events: `sqlite3 ~/.orch/orch.db "SELECT event_type, COUNT(*) FROM task_activity WHERE timestamp > datetime('now', '-12 hours') GROUP BY event_type ORDER BY COUNT(*) DESC;" 2>/dev/null`

      ## Write the summary

      Save to `./docs/content/posts/morning-review-YYYY-MM-DD.md` (today's UTC date).
      If the file already exists, update it with new information or improvements. If there's nothing new to add, skip — don't rewrite or duplicate.

      Include: recent commits summary, operational health status, stuck tasks, retro follow-ups, and what the day's priorities should be.

      ## Create GitHub issues if needed

      If you find operational problems (stuck tasks, recurring failures, error patterns), create issues with `gh issue create --title "..." --body "..." --label "bug"`.

      - Maximum 2-3 issues. Only for operational problems found during this review.
      - Focus on ROOT CAUSES, not symptoms
      - Do NOT duplicate issues that already exist (`gh issue list --state open`).
      - Do NOT create feature/improvement issues — that's the development job's responsibility.

      Commit and push the summary post.
    agent: null
  command: null
  enabled: true
  external: false
- id: evening-retrospective
  type: task
  schedule: '0 23 * * *'
  task:
    title: 'Daily evening retrospective'
    body: |
      Evening retrospective. Your ONLY output is a summary post — do NOT modify code.

      ## Gather context

      1. `git log --since="12 hours ago" --oneline` — what was done today
      2. Read the most recent post in `./docs/content/posts/` — current state
      3. Read today's morning review — what was planned, what got done
      4. `gh issue list --state open` — what's still pending
      5. `gh issue list --state closed --limit 10` — what was resolved today
      6. Read `~/.claude/skills/orch/SKILL.md` — check for new learnings, patterns, and operational notes added during the day

      ## Analyze the day

      1. Which tasks completed? What went well?
      2. Which tasks failed or needed retries? Why? Check `task_runs` for patterns.
      3. Are agent prompts effective or do they need tuning?
      4. Is the routing accurate? Check route decisions vs outcomes. Are certain models failing silently?
      5. Are there performance bottlenecks (slow syncs, lock contention, API rate limits, dead models)?
      6. What learnings were captured in the orch skill today? Are they reflected in code/config changes?

      ## Write the summary

      Save to `./docs/content/posts/evening-retrospective-YYYY-MM-DD.md` (today's UTC date).
      If the file already exists, update it with new information or improvements. If there's nothing new to add, skip — don't rewrite or duplicate.

      Include: what was accomplished, what failed and why, routing accuracy, and clear priorities for tomorrow's morning review.

      ## Create GitHub issues if needed

      If you find problems (recurring failures, broken workflows, prompt issues), create issues with `gh issue create --title "..." --body "..." --label "bug"`.

      - Maximum 2-3 issues. Only for problems discovered during this review.
      - Focus on ROOT CAUSES, not symptoms
      - Do NOT duplicate issues that already exist (`gh issue list --state open`).
      - Do NOT create feature/improvement issues — that's the development job's responsibility.

      Commit and push the summary post.
    agent: null
  command: null
  enabled: true
  external: false
- id: agent-debugger
  type: task
  schedule: '0 11,21 * * *'
  task:
    title: 'Self-improvement: debug agent errors and fix root causes'
    body: |
      You are a self-improvement agent. Your job is to analyze recent agent failures, find root causes, and either fix them directly or file detailed issues.

      ## Step 0: Read the orch skill

      Read `~/.claude/skills/orch/SKILL.md` first — it contains operational learnings, known patterns, common fixes, and agent/model notes accumulated from previous sessions. Use this context to avoid re-discovering known issues. If your analysis reveals new patterns or corrections, update the skill file at the end of your run.

      ## Step 1: Gather failure data

      1. Check recent task run logs for failures:
         ```
          sqlite3 ~/.orch/orch.db "SELECT id, external_id, status, agent, model, last_error, block_reason, updated_at FROM tasks WHERE status IN ('blocked', 'needs_review') AND updated_at > datetime('now', '-12 hours') ORDER BY updated_at DESC LIMIT 20;"
         ```
      2. Check recent task run audit trails:
         ```
         sqlite3 ~/.orch/orch.db "SELECT agent, model, outcome, COUNT(*) AS count FROM task_runs WHERE started_at > datetime('now', '-12 hours') AND outcome != 'success' GROUP BY agent, model, outcome ORDER BY count DESC;"
         sqlite3 ~/.orch/orch.db "SELECT agent, started_at, error FROM task_runs WHERE outcome = 'rate_limit' AND started_at > datetime('now', '-24 hours') ORDER BY started_at;"
         sqlite3 ~/.orch/orch.db "SELECT agent, outcome, SUM(total_cost_usd) AS total_cost, COUNT(*) AS runs FROM task_runs WHERE started_at > datetime('now', '-24 hours') GROUP BY agent, outcome;"
         ```
      3. Read the service log for errors:
         ```
         tail -500 /opt/homebrew/var/log/orch.log | grep -i 'error\|warn' | grep -v 'error sending request\|kill-session failed' | tail -30
         ```
      4. Inspect task-specific run history when a task needs more context:
         ```
         orch task runs <id>
         orch task runs <id> --verbose
         ```

      ## Step 2: Classify failures

      For each failure, determine the category:
      - **Parser failure** — agent returned valid work but in wrong format (plain text, malformed JSON)
      - **Rate limit** — agent hit usage limits (should have been cooled down)
      - **Push/auth failure** — git operations failed (SSH keys, token issues)
      - **Timeout** — agent took too long
      - **Review loop** — task stuck cycling between statuses
      - **State drift** — task status doesn't match reality (merged PR but task still blocked)

      ## Step 3: File detailed issues (DO NOT fix code directly)

      For each root cause, file a GitHub issue with `gh issue create`. Do NOT modify code yourself — the task pipeline handles implementation. Your job is analysis and documentation.

      Each issue MUST include:
      - **What you found** — the specific error, task IDs, log lines
      - **Why it's happening** — root cause analysis with file paths and line numbers
      - **Why it matters** — impact (how many tasks affected, how much time wasted)
      - **Suggested fix** — concrete approach with files to change
      - **Evidence** — actual error messages, SQL query results, log snippets

      Use `gh issue create --title "bug: ..." --body "..." --label "bug"` for bugs and `--label "enhancement"` for improvements.

      ## Before starting

      - `gh issue list --state open` — don't duplicate existing issues
      - `gh issue list --state closed --limit 20` — don't re-file resolved problems
      - `git log --since="24 hours ago" --oneline` — check what was already fixed
      - Read `AGENTS.md` DO NOT TOUCH sections

      ## Rules

      - Focus on ROOT CAUSES, not symptoms
      - Always include the actual error message and task ID in issues
      - Max 3 issues per run — prioritize by impact (looping tasks > one-off failures)
      - Do NOT modify code, prompts, or config — only file issues
      - Explain your reasoning: why you identified this as a problem, what data led you there
    agent: null
  enabled: true
  external: false
- id: self-review
  type: task
  schedule: '0 2 * * 0'
  task:
    title: 'Self-review: analyze metrics and file improvement issues'
    body: |
      Analyze orch metrics from the last 7 days and file issues for patterns that need attention:

      1. High failure rate agents (>50% failure rate with 3+ runs)
      2. Recurring error patterns (same error type 2+ times)
      3. Slow complex tasks (>10 min for complex tasks)
      4. Persistent review loops (3+ tasks with 2+ review cycles)

      Use `orch task list`, `orch metrics`, `orch doctor`, and SQLite queries to gather data.
      Only file issues if patterns are significant. Deduplicate against existing open issues.
      Label issues: self-improvement, scheduled, automation.
      Max 4 issues per run.
  enabled: true
  external: false
gh:
  repo: gabrielkoerich/orch
