#     review: ""
#     done: ""

# Scheduled jobs for this project
# Schedule shortcuts: @hourly @daily @weekly @monthly @yearly
# Dedup: if active_task_id points to a task that isn't done the job waits.
# Tasks can delegate, retry, get reviewed and approve.
# The job won't create a duplicate until the previous run finishes.
