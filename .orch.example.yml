#   - id: daily-sync
#     schedule: "0 9 * * *"         # cron expression (min hour dom month dow)
#     task:
#       title: "Daily code sync"
#       body: "Pull latest changes and run linting"
#       labels: [sync]
#       agent: ""                   # empty = let router decide
#     enabled: true

# Other available keys can be found in the global config (~/.orch/config.yml).
