# Per-project orch config (.orch.yml)
# Place this file in your project root directory.
# Values here override the global config (~/.orch/config.yml).
#
# Only include the keys you want to override — everything else
# falls through to the global config.

# Required — identifies this project on GitHub
gh:
  repo: "myorg/myproject"
