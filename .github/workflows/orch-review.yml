# Orch Review Gate - installed by `orch init`
# Checks the orch App's review on the head commit, then PR issue comments for automated review decisions.
# "Automated Review - Approve" -> pass, "Automated Review - Changes Requested" -> fail.
name: Orch Review Gate

on:
  push:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  docs-build:
    name: Docs Build (Zola)
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect docs changes
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            docs:
              - 'docs/**'

      - name: Build docs
        if: steps.changes.outputs.docs == 'true'
        uses: gabrielkoerich/zola-docs-action@e1ec41316383ce777846abbdb0c9ba9ab6109b0a # v1
        with:
          path: docs
          zola-version: "0.22.1"
          upload: "false"

      - name: Skip docs build when no docs changed
        if: steps.changes.outputs.docs != 'true'
        run: echo "No docs changes detected; skipping zola build."

  review-gate:
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint docs front matter
        run: |
          chmod +x scripts/lint-frontmatter.sh
          ./scripts/lint-frontmatter.sh

      - name: Check automated review status
        env:
          GH_TOKEN: ${{ github.token }}
          # App login, e.g. `my-app[bot]`. Unset keeps the comment gate
          ORCH_REVIEW_APP: ${{ vars.ORCH_REVIEW_APP }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF#refs/heads/}"

          # Find the open PR for this branch
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json number -q '.[0].number' 2>/dev/null || true)

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for branch $BRANCH - skipping review gate."
            exit 0
          fi

          echo "Checking review status for PR #${PR_NUMBER} (branch: $BRANCH)"

          # The App's latest review on this commit is the decision, a review on an older sha does not count
          if [ -n "${ORCH_REVIEW_APP:-}" ]; then
            APP_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              | jq -rs --arg login "$ORCH_REVIEW_APP" --arg sha "$HEAD_SHA" \
                '[add[] | select(.user.login == $login and .commit_id == $sha and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))] | sort_by(.submitted_at) | last | .state // empty')
            if [ "$APP_STATE" = "APPROVED" ]; then
              echo "App review on ${HEAD_SHA}: approved"
              exit 0
            elif [ "$APP_STATE" = "CHANGES_REQUESTED" ]; then
              echo "App review on ${HEAD_SHA}: changes requested"
              exit 1
            fi
          fi

          # Get the latest "Automated Review" comment body
          LATEST_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("## Automated Review"))] | sort_by(.created_at) | last | .body // empty' \
            2>/dev/null || true)

          if [ -z "$LATEST_BODY" ]; then
            echo "No automated review comments found - review pending."
            exit 0
          fi

          FIRST_LINE=$(echo "$LATEST_BODY" | head -1)

          if echo "$FIRST_LINE" | grep -q "Approve"; then
            echo "Automated review: approved"
            exit 0
          elif echo "$FIRST_LINE" | grep -q "Changes Requested"; then
            echo "Automated review: changes requested"
            echo ""
            echo "$LATEST_BODY" | tail -n +3
            exit 1
          else
            echo "Unrecognized review comment format - passing by default"
            exit 0
          fi
