name: Integration Tests

on:
  # Disabled until API keys are configured as secrets
  # schedule:
  #   - cron: '0 0 * * *'   # 00:00 UTC daily
  #   - cron: '0 12 * * *'  # 12:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-tests
  cancel-in-progress: true

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-all-crates: true
          # cache-workspace-crates: true

      - name: Install agent CLIs
        run: |
          # Claude Code
          if ! command -v claude &>/dev/null; then
            brew install --cask claude-code || echo "claude-code not available"
          fi

          # Codex
          if ! command -v codex &>/dev/null; then
            npm install -g @openai/codex || echo "codex not available"
          fi

          # OpenCode
          if ! command -v opencode &>/dev/null; then
            brew install opencode || echo "opencode not available"
          fi

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: cargo test --test integration_agents -- --ignored --nocapture
