name: CI

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run Rust formatting, lints, and test suite with code coverage.
  # Produces an lcov artifact and posts a coverage report on PRs.
  # Uses cargo-llvm-cov for line/branch coverage — cheaper than tarpaulin.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""
          components: clippy, rustfmt

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-all-crates: true
          # cache-workspace-crates: true

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check for SELECT * in store files
        run: |
          # Fail CI if any store file contains SELECT * (excluding comments)
          # This prevents SQLite OOB panics when schema changes
          # Filter out: // comments, /// doc comments, //! module docs (format: file.rs:line:// content)
          MATCHES=$(grep -n 'SELECT \*' src/store/*.rs | grep -vE ':[0-9]+:\s*(//|///|//!|#|\*)' | grep -v 'COLUMN_COLS' || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Found SELECT * in src/store/ files. Use explicit column lists instead."
            echo "Matches:"
            echo "$MATCHES"
            echo ""
            echo "See TASK_COLS, CONTROL_MESSAGE_COLS, JOB_STATE_COLS for examples."
            exit 1
          fi
          echo "✓ No SELECT * found in store files"

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Report coverage on PR
        uses: romeovs/lcov-reporter-action@v0.4.0
        if: github.event_name == 'pull_request'
        with:
          lcov-file: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Scan the full git history for accidentally committed secrets (tokens, keys).
  # Runs gitleaks with the project's .gitleaks.toml allowlist to suppress
  # known false positives. fetch-depth: 0 is required for full-history scans.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # Determine if a release is needed and what version to use
  check-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
      last_tag: ${{ steps.check.outputs.last_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$LAST_TAG" ]; then
            COMMIT_COUNT=$(git rev-list "$LAST_TAG"..HEAD --count)
          else
            COMMIT_COUNT=$(git rev-list HEAD --count)
          fi
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since $LAST_TAG — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Skip release if ALL commits are chore/docs-only
            if [ -n "$LAST_TAG" ]; then
              SUBJECTS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
            else
              SUBJECTS=$(git log --pretty=format:"%s")
            fi
            NON_RELEASE=$(echo "$SUBJECTS" | grep -cvE '^(chore|docs)(\(.*\))?:' || true)
            if [ "$NON_RELEASE" -eq 0 ]; then
              echo "All $COMMIT_COUNT commits are chore/docs — skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "$COMMIT_COUNT new commits since ${LAST_TAG:-beginning} ($NON_RELEASE release-worthy)"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Determine version bump from conventional commits
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          LAST_TAG="${{ steps.check.outputs.last_tag }}"

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          # Determine bump from commit prefixes: BREAKING CHANGE: → major, feat: → minor, everything else → patch
          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^feat(\(.*\))?:'; then
            BUMP="minor"
          fi
          if echo "$COMMITS" | grep -qE '^BREAKING CHANGE:|^breaking(\(.*\))?:'; then
            BUMP="major"
          fi

          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            CURRENT="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $NEW_VERSION (${BUMP} bump)"

  # Cross-compile build jobs for macOS targets.
  # Skip when check-release says skip=true (chore/docs commits).
  build-macos:
    needs: [check-release]
    if: github.ref == 'refs/heads/main' && needs.check-release.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-build"
          key: ${{ matrix.target }}
          cache-all-crates: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          ORCH_BUILD_VERSION: ${{ needs.check-release.outputs.version }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/orch dist/orch-${{ matrix.arch }}
          chmod +x dist/orch-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: orch-${{ matrix.arch }}
          path: dist/orch-${{ matrix.arch }}
          retention-days: 1

  # Create GitHub release with binaries
  release:
    needs: [test, secrets, check-release, build-macos]
    if: github.ref == 'refs/heads/main' && needs.check-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: orch-*

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Build changelog
        id: changelog
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          LAST_TAG="${{ needs.check-release.outputs.last_tag }}"

          # Build changelog from commit subjects
          if [ -n "$LAST_TAG" ]; then
            RAW=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s (%h)")
          else
            RAW=$(git log --pretty=format:"%s (%h)")
          fi

          FEATURES=""
          FIXES=""
          OTHER=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if echo "$line" | grep -qE '^feat(\(.*\))?:'; then
              FEATURES+="- ${line}"$'\n'
            elif echo "$line" | grep -qE '^fix(\(.*\))?:'; then
              FIXES+="- ${line}"$'\n'
            elif echo "$line" | grep -qE '^chore(\(.*\))?:'; then
              continue
            else
              OTHER+="- ${line}"$'\n'
            fi
          done <<< "$RAW"

          BODY="## ${VERSION}"$'\n\n'
          [ -n "$FEATURES" ] && BODY+="### Features"$'\n'"${FEATURES}"$'\n'
          [ -n "$FIXES" ] && BODY+="### Bug Fixes"$'\n'"${FIXES}"$'\n'
          [ -n "$OTHER" ] && BODY+="### Other"$'\n'"${OTHER}"$'\n'

          if [ -n "$LAST_TAG" ]; then
            BODY+="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${VERSION}"
          fi

          # Write to file for use in release creation
          echo "$BODY" > release_notes.md
          cat release_notes.md

      - name: Compute SHA256 checksums
        id: checksums
        run: |
          cd artifacts

          # Compute checksums for all artifacts
          for file in orch-*/orch*; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> ../checksums.txt
            fi
          done

          cd ..
          cat checksums.txt

          # Get checksums for each architecture
          ARM64_SHA=$(grep "orch-arm64/orch-arm64" checksums.txt | awk '{print $1}')
          X86_64_SHA=$(grep "orch-x86_64/orch-x86_64" checksums.txt | awk '{print $1}')
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha=$X86_64_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            artifacts/orch-arm64/orch-arm64 \
            artifacts/orch-x86_64/orch-x86_64 \
            checksums.txt

          echo "Created release $VERSION"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          REPO="${{ github.repository }}"
          TAP_REPO="gabrielkoerich/homebrew-tap"
          ARM64_SHA="${{ steps.checksums.outputs.arm64_sha }}"
          X86_64_SHA="${{ steps.checksums.outputs.x86_64_sha }}"

          # URLs for each architecture binary
          ARM64_URL="https://github.com/${REPO}/releases/download/${VERSION}/orch-arm64"
          X86_64_URL="https://github.com/${REPO}/releases/download/${VERSION}/orch-x86_64"

          echo "Updating formula with:"
          echo "  Version: $VERSION_NO_V"
          echo "  ARM64 URL: $ARM64_URL"
          echo "  ARM64 SHA256: $ARM64_SHA"
          echo "  x86_64 URL: $X86_64_URL"
          echo "  x86_64 SHA256: $X86_64_SHA"

          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is required to push to ${TAP_REPO}"
            exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula

          # Create updated formula using the template
          cat > tap-repo/Formula/orch.rb << 'FORMULA_EOF'
          class Orch < Formula
            desc "Multi-agent task orchestrator for AI coding agents (claude, codex, opencode)"
            homepage "https://github.com/gabrielkoerich/orch"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "ARM64_URL_PLACEHOLDER"
                sha256 "ARM64_SHA256_PLACEHOLDER"
              else
                url "X86_64_URL_PLACEHOLDER"
                sha256 "X86_64_SHA256_PLACEHOLDER"
              end
            end

            depends_on "gh"
            depends_on "tmux"

            def install
              bin.install "orch-arm64" => "orch" if Hardware::CPU.arm?
              bin.install "orch-x86_64" => "orch" if Hardware::CPU.intel?

              # Install additional resources
              (libexec/"prompts").install Dir["prompts/*"] if (buildpath/"prompts").exist?
              libexec.install Dir["*.example.yml"] if Dir.glob("*.example.yml").any?
              libexec.install "skills.yml" if (buildpath/"skills.yml").exist?
            end

            service do
              run [opt_bin/"orch", "serve"]
              keep_alive true
              log_path var/"log/orch.log"
              error_log_path var/"log/orch.error.log"
            end

            def caveats
              <<~EOS
                To get started:
                  cd ~/your-project
                  orch init                     # configure project
                  orch task add "title"         # add a task
                  brew services start orch      # start background server

                Required agent CLIs (install at least one):
                  brew install --cask claude-code   # Claude
                  brew install --cask codex         # Codex
                  brew install opencode             # OpenCode

                GitHub CLI (installed automatically):
                  gh auth login   # authenticate if not already logged in
              EOS
            end

            test do
              assert_match "orch", shell_output("#{bin}/orch --version 2>&1", 0)
            end
          end
          FORMULA_EOF

          sed -i "s/VERSION_PLACEHOLDER/${VERSION_NO_V}/g" tap-repo/Formula/orch.rb
          sed -i "s|ARM64_URL_PLACEHOLDER|${ARM64_URL}|g" tap-repo/Formula/orch.rb
          sed -i "s/ARM64_SHA256_PLACEHOLDER/${ARM64_SHA}/g" tap-repo/Formula/orch.rb
          sed -i "s|X86_64_URL_PLACEHOLDER|${X86_64_URL}|g" tap-repo/Formula/orch.rb
          sed -i "s/X86_64_SHA256_PLACEHOLDER/${X86_64_SHA}/g" tap-repo/Formula/orch.rb

          # Display the formula
          echo "--- Generated Formula ---"
          cat tap-repo/Formula/orch.rb
          echo "--- End Formula ---"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap-repo config user.name "github-actions[bot]"
          git -C tap-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap-repo add Formula/orch.rb
          if git -C tap-repo diff --cached --quiet; then
            echo "Homebrew formula unchanged"
            exit 0
          fi
          git -C tap-repo commit -m "chore: update orch formula to ${VERSION}"
          git -C tap-repo push origin main

  # Build Zola docs and deploy to GitHub Pages on every push to main.
  deploy:
    needs: [test, secrets]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - run: zola --root docs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public
      - id: deployment
        uses: actions/deploy-pages@v4
