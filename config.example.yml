projects:
  - /path/to/your/project

# Agents to discover in PATH (checked at startup).
# Any Claude-compatible CLI (e.g. olm for Ollama) can be added here
# without code changes — unknown agents use the Claude runner automatically.
agents:
  - claude
  - codex
  - opencode
  - kimi
  - minimax
  # - olm  # Ollama via Claude-compatible CLI

workflow:
  auto_close: true
  review_owner: "@owner"
  enable_review_agent: false
  max_attempts: 10
  # Only accept issues from these GitHub users. Repo owner is always included.
  # allowed_authors:
  #   - my-bot
  #   - trusted-collaborator
  # Default task timeout (seconds). Set to 0 to disable timeouts entirely.
  timeout_seconds: 1800
  # Optional: per-complexity overrides (takes precedence over timeout_seconds).
  # timeout_by_complexity:
  #   simple: 600
  #   medium: 1800
  #   complex: 3600
  # Auto-create follow-up tasks when PR reviews request changes (default: true)
  auto_create_followup_on_changes: true
  # Allowed tools for agents (used in permission rules)
  allowed_tools:
    - Edit
    - Write
    - Read
    - Bash
    - Grep
    - Glob
    - WebFetch
    - WebSearch
    - Task
    - Skill

# Engine settings
engine:
  tick_interval: 10
  sync_interval: 45
  max_parallel: 4
  stuck_timeout: 1800
  graceful_shutdown_timeout: 600
  # Silence detection: grace period before flagging (seconds)
  # silence_grace_period: 120
  # silence_cooldown: 3600

router:
  mode: "round_robin"      # "round_robin" (default), "llm", or "local"
  agent: "claude"          # Which agent performs routing
  model: "haiku"           # Model for routing (fast/cheap)
  timeout_seconds: 60
  fallback_executor: "codex"
  max_route_attempts: 3    # After N LLM routing failures, fall back to round-robin
  # Enable weighted round-robin: deprioritize agents hitting rate limits.
  # weighted_round_robin: false
  # Local Ollama routing (when mode: "local")
  # ollama_url: "http://localhost:11434"        # Ollama API endpoint (default)
  # ollama_model: "qwen2.5-coder:3b-instruct"  # Model to use (default)
  # ollama_timeout_seconds: 30                  # Timeout for Ollama calls (default)
  # Routing weights (higher = more tasks routed to this agent)
  # weights:
  #   claude: 0.25
  #   codex: 0.1
  #   opencode: 0.25
  # Routing pool for LLM router (agent:model pairs; only used when mode: "llm")
  # pool:
  #   - claude:haiku
  #   - opencode:free
  allowed_tools:
    - yq
    - jq
    - bash
    - just
    - git
    - rg
    - sed
    - awk
    - python3
    - node
    - npm
    - bun
  default_skills:
    - gh
    - git-worktree

# Simple model config. Each agent's candidates are used for simple, medium,
# complex, and review tasks. When multiple candidates are listed, orch selects
# uniformly across available non-cooled models.
models:
  claude: haiku
  codex: gpt-5.2-codex
  opencode:
    - opencode:free
    - github-copilot/gpt-5-mini
  kimi: sonnet
  minimax: sonnet
  # olm: qwen3.5

# Advanced model config. Use this only when an agent needs different model
# candidates for different complexity tiers. Entries here override `models:`
# for the specified tier and agent.
# model_map:
#   simple:
#     codex: gpt-5.2-codex
#   medium:
#     codex: gpt-5.3-codex
#   complex:
#     codex: gpt-5.4
#   review:
#     codex: gpt-5.3-codex

gh:
  repo: "owner/repo"
  # GitHub Projects v2 integration (optional)
  # project_id: ""
  # project_status_field_id: ""
  # project_status_map:
  #   backlog: ""
  #   in_progress: ""
  #   review: ""
  #   done: ""
  auth:
    # Auth mode: "auto" | "token" | "github_app" | "gh_cli"
    # - "auto" (default): GH_TOKEN/GITHUB_TOKEN env → GitHub App → gh CLI
    # - "token": Require PAT from env vars or gh.auth.token
    # - "github_app": Use GitHub App authentication
    # - "gh_cli": Always use `gh auth token`
    mode: "auto"
    # token: "ghp_xxxxxxxxxxxxxxxxxxxx"
    # app_id: "123456"
    # private_key: "/path/to/app-private-key.pem"
    # installation_id: "78901234"
    allow_gh_fallback: true

# GitHub webhook server for instant event delivery (bypasses polling)
# webhook:
#   enabled: false
#   port: 8080
#   secret: "${WEBHOOK_SECRET}"

# Task completion notifications — broadcast to all configured channels.
# Level: all (default) | errors_only | none
notifications:
  level: "all"

# External notification channels
channels:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  discord:
    enabled: false
    bot_token: "${DISCORD_BOT_TOKEN}"
    channel_id: "${DISCORD_CHANNEL_ID}"
