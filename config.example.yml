projects:
  - /path/to/your/project

# Agents to discover in PATH (checked at startup).
# Any Claude-compatible CLI (e.g. olm for Ollama) can be added here
# without code changes — unknown agents use the Claude runner automatically.
agents:
  - claude
  - codex
  - opencode
  - kimi
  - minimax
  # - olm  # Ollama via Claude-compatible CLI

workflow:
  # Task timeout in seconds (default and minimum: 1800).
  # timeout_seconds: 1800
  # Per-complexity overrides, floored at timeout_seconds. Simple tasks use timeout_seconds.
  # timeout_by_complexity:
  #   medium: 2700
  #   complex: 3600
  # Allowed tools for agents (used in permission rules)
  allowed_tools:
    - Edit
    - Write
    - Read
    - Bash
    - Grep
    - Glob
    - WebFetch
    - WebSearch
    - Task
    - Skill

# Engine settings (defaults shown)
# engine:
#   tick_interval: 10
#   sync_interval: 45
#   max_parallel: 4
#   stuck_timeout: 1800
#   graceful_shutdown_timeout: 600
#   silence_grace_period: 300
#   silence_cooldown: 3600

router:
  # mode: "round_robin"    # "round_robin" (default), "llm", or "local"
  # agent: "claude"        # Which agent performs routing (default)
  # model: "haiku"         # Model for routing (default)
  # timeout_seconds: 45    # Default and maximum
  # fallback_executor: "codex"
  # max_route_attempts: 3  # After N LLM routing failures, fall back to round-robin
  # Enable weighted round-robin: deprioritize agents hitting rate limits.
  # weighted_round_robin: false
  # Local Ollama routing (when mode: "local")
  # ollama_url: "http://localhost:11434"        # Ollama API endpoint (default)
  # ollama_model: "qwen2.5-coder:3b-instruct"  # Model to use (default)
  # ollama_timeout_seconds: 30                  # Timeout for Ollama calls (default)
  # Routing weights (higher = more tasks routed to this agent)
  # weights:
  #   claude: 0.25
  #   codex: 0.1
  #   opencode: 0.25
  # Routing pool for LLM router (agent:model pairs; only used when mode: "llm")
  # pool:
  #   - claude:haiku
  #   - opencode:free

# Simple model config. Each agent's candidates are used for simple, medium,
# complex, and review tasks. When multiple candidates are listed, orch picks
# one based on the router mode and skips cooled / unavailable models.
models:
  claude: haiku
  codex: gpt-5.2-codex
  opencode:
    - opencode:free
    - github-copilot/gpt-5-mini
  kimi: sonnet
  minimax: sonnet
  # olm: qwen3.5

# Advanced model config. Use this only when an agent needs different model
# candidates for different complexity tiers. Entries here override `models:`
# for the specified tier and agent.
# model_map:
#   simple:
#     codex: gpt-5.2-codex
#   medium:
#     codex: gpt-5.3-codex
#   complex:
#     codex: gpt-5.4
#   review:
#     codex: gpt-5.3-codex

gh:
  repo: "owner/repo"
  # GitHub Projects v2 integration (optional)
  # project_id: ""
  # project_status_field_id: ""
  # project_status_map:
  #   backlog: ""
  #   in_progress: ""
  #   review: ""
  #   done: ""
  auth:
    # Used when GH_TOKEN and GITHUB_TOKEN are unset, before falling back to `gh auth token`
    # token: "ghp_xxxxxxxxxxxxxxxxxxxx"

# GitHub webhook server for instant event delivery (bypasses polling)
# webhook:
#   enabled: false
#   port: 8080
#   secret: "<webhook secret>"

# Task completion notifications — broadcast to all configured channels.
# Level: all (default) | verbose | errors_only | none
# notifications:
#   level: "all"

# External notification channels. A channel starts when its token is set.
# Values are used as written, environment variables are not expanded.
# channels:
#   telegram:
#     bot_token: "<telegram bot token>"
#     chat_id: "<telegram chat id>"
#   discord:
#     bot_token: "<discord bot token>"
#     channel_id: "<discord channel id>"
